<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>IT Helpdesk System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form, table { margin-bottom: 20px; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h2>แจ้งซ่อมอุปกรณ์ไอที</h2>
  <form id="ticketForm">
    <input type="text" id="title" placeholder="หัวข้อปัญหา" required>
    <select id="category">
      <option value="Hardware">Hardware</option>
      <option value="Network">Network</option>
      <option value="Software">Software</option>
    </select>
    <input type="text" id="description" placeholder="รายละเอียด">
    <button type="submit">ส่งเรื่อง</button>
  </form>

  <h2>รายการแจ้งซ่อมทั้งหมด</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>หัวข้อ</th><th>หมวดหมู่</th><th>สถานะ</th><th>จัดการ</th></tr>
    </thead>
    <tbody id="ticketTable"></tbody>
  </table>
  <script src="app.js"></script>
</body>
</html>
